<!DOCTYPE html>
<html>
<head>
    <title>Futuristic File Explorer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #02040a;
            color: white;
            padding: 20px;
        }
        canvas {
            display: block;
            margin: 20px auto;
        }
        .status {
            margin-top: 10px;
            font-size: 18px;
            color: #fff;
        }
        .path {
            margin-top: 20px;
            font-size: 16px;
        }
        .message {
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div data-role="status">Ready</div>
    <div data-role="path">Current Folder: </div>
    <div data-role="message">Message: </div>

    <canvas id="scene" data-role="scene"></canvas>
